# Batch-simulation compose file.
#
# Docker is ONLY for simulations (`sim` service). Live/ADB play always runs
# on the Windows host (USB is not forwarded into containers) -- there is
# deliberately no live/vision service here and the image has no [device]
# extra installed.
#
# Usage (from the project/ directory):
#   docker compose -f docker/compose.yaml build
#   docker compose -f docker/compose.yaml run sim sim run \
#       --strategy expectimax --games 500 --db data/games.db
#
# The host ./data directory is mounted at /app/data, so the SQLite telemetry
# (games.db) written inside the container lands next to the host runs and
# can be analyzed with `bot2048 db ...` locally.

services:
  sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: bot2048:latest
    volumes:
      - ../data:/app/data
